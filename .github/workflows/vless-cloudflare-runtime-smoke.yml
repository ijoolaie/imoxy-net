name: Disposable VLESS Cloudflare runtime smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vless-cloudflare-runtime-smoke.yml"
      - "test/vless-cloudflare-runtime-smoke.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Exercise disposable VLESS Worker with two concurrent WebSocket clients
        env:
          IMOXY_VLESS_WS_URL: "wss://imoxy-vless-service-smoke-disposable.shilterfekanworkgd.workers.dev/proxy/vless"
          IMOXY_VLESS_CREDENTIAL: "7a04f728-744b-480e-bc64-df0fe5852e8a"
        run: node test/vless-cloudflare-runtime-smoke.mjs
