name: VLESS Cloudflare disposable smoke

on:
  workflow_dispatch:
    inputs:
      confirm_disposable_run:
        description: Create temporary D1 and Worker resources, run the bounded smoke test, then delete them
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  smoke:
    if: github.ref == 'refs/heads/main' && inputs.confirm_disposable_run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "0d548671f52ffc237fb80dcb2067ac1a"
      IMOXY_CONFIRM_DISPOSABLE_RUN: \${{ inputs.confirm_disposable_run }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run isolated Cloudflare VLESS smoke
        run: node scripts/vless-service-binding-cloudflare-smoke.mjs
