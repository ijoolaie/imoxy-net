name: CI

on:
  push:
    branches: [main, "chore/**", "feat/**", "fix/**", "test/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run verify
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python test/test_issue78_tcp_fault_injector.py -v
